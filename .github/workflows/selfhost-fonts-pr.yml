on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  fetch-fonts-and-pr:
    runs-on: ubuntu-latest
    name: Fetch Google Fonts and open PR
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Prepare directories
        run: mkdir -p assets/fonts

      - name: Fetch Google Fonts CSS
        env:
          GOOGLE_FONTS_CSS: "https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Roboto:wght@400;500&display=swap"
        run: |
          set -euo pipefail
          # User-Agent Chrome moderno → Google Fonts risponde con woff2 invece di TTF
          curl -s -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36" \
            "$GOOGLE_FONTS_CSS" -o /tmp/gf.css
          echo "Saved /tmp/gf.css (size: $(stat -c%s /tmp/gf.css) bytes)"
          echo "=== Anteprima CSS scaricato ==="
          head -30 /tmp/gf.css

      - name: Extract and download font files
        run: |
          set -euo pipefail
          grep -oE "url\([^)]+\)" /tmp/gf.css \
            | sed -E "s/url\((https?:[^)]*)\)/\1/" \
            | tr -d '"'"'" \
            | sort -u > /tmp/font-urls.txt
          echo "=== URL font trovati ==="
          cat /tmp/font-urls.txt
          while IFS= read -r url; do
            [ -z "$url" ] && continue
            fname=$(basename "${url%%\?*}")
            echo "Downloading $url -> assets/fonts/$fname"
            curl -fL "$url" -o "assets/fonts/$fname"
          done < /tmp/font-urls.txt

      - name: Generate fonts.css
        run: |
          python3 scripts/selfhost_fonts.py /tmp/gf.css assets/fonts/fonts.css
          echo "=== fonts.css generato ==="
          cat assets/fonts/fonts.css

      - name: Configure git
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

      - name: Commit and open PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PR_BRANCH="fonts/selfhost-$(date +'%Y%m%d-%H%M%S')"
          git checkout -b "$PR_BRANCH"
          git add assets/fonts
          if git diff --cached --quiet; then
            echo "Nessuna modifica ai font. Uscita."
            exit 0
          fi
          git commit -m "chore: self-hosted fonts woff2 Montserrat 600/700/800 + Roboto 400/500"
          git push --set-upstream origin "$PR_BRANCH"
          gh pr create \
            --title "chore: self-hosted fonts woff2 (Montserrat 600/700/800)" \
            --body "Aggiorna assets/fonts/ con file woff2 e fonts.css rigenerato con weight 800." \
            --base main \
            --head "$PR_BRANCH"
