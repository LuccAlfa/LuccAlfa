on:
  workflow_dispatch:
  push:
    paths:
      - 'assets/**'

permissions:
  contents: write
  pull-requests: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    name: Generate responsive images (webp/avif)
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Run image generator
        run: npm run generate-images

      - name: Configure git
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

      - name: Commit and open PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PR_BRANCH="images/optimized-$(date +'%Y%m%d-%H%M%S')"
          git checkout -b "$PR_BRANCH"
          git add assets/optimized
          # Se non ci sono modifiche il workflow finisce senza aprire PR
          if git diff --cached --quiet; then
            echo "Nessuna immagine nuova da committare. Uscita."
            exit 0
          fi
          git commit -m "chore: generate responsive images (webp/avif)"
          git push --set-upstream origin "$PR_BRANCH"
          gh pr create \
            --title "chore: add optimized images (webp/avif)" \
            --body "Immagini responsive WebP/AVIF generate da GitHub Actions. Mergia per attivare il fix LCP." \
            --base main \
            --head "$PR_BRANCH"
